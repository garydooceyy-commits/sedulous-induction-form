<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sedulous Rail — Personal & Bank Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eef1ec; --panel:#ffffff; --panel-2:#f7f8f5;
    --ink:#1a2420; --ink-muted:#54615a; --line:#c9d0c6; --line-strong:#a7b0a3;
    --accent:#d45b12; --accent-ink:#ffffff; --accent-soft:#f6ded0;
    --go:#2e6b3e; --go-soft:#dcece1; --stop:#b3261e; --stop-soft:#f6dcd9;
    --shadow: 0 1px 2px rgba(20,26,20,.06), 0 6px 16px rgba(20,26,20,.06);
    --radius: 14px;
    --font-head: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif;
    --font-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12181a; --panel:#1b2225; --panel-2:#20282b;
      --ink:#e8ece6; --ink-muted:#a7b1aa; --line:#333d39; --line-strong:#47524c;
      --accent:#f0812f; --accent-ink:#1a1006; --accent-soft:#3a2515;
      --go:#5cae6c; --go-soft:#1c3324; --stop:#e5695f; --stop-soft:#3a201d;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12181a; --panel:#1b2225; --panel-2:#20282b;
    --ink:#e8ece6; --ink-muted:#a7b1aa; --line:#333d39; --line-strong:#47524c;
    --accent:#f0812f; --accent-ink:#1a1006; --accent-soft:#3a2515;
    --go:#5cae6c; --go-soft:#1c3324; --stop:#e5695f; --stop-soft:#3a201d;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-inline:16px;
    padding-block:0;
    min-height:100vh;
  }
  h1,h2,h3{font-family:var(--font-head); font-weight:700; text-wrap:balance; margin:0}
  .eyebrow{
    font-family:var(--font-head); font-weight:600; letter-spacing:.09em; text-transform:uppercase;
    font-size:12.5px; color:var(--ink-muted);
  }
  a{color:var(--accent)}

  /* ---- Top identity bar ---- */
  .topbar{
    max-width:640px; margin:0 auto; padding-top:18px;
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  }
  .topbar .brand{font-family:var(--font-head); font-weight:700; font-size:19px; letter-spacing:.01em}
  .topbar .doc-ref{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-muted)}

  /* ---- Sleeper-tick progress rail ---- */
  .rail-wrap{max-width:640px; margin:14px auto 0; padding:0 2px}
  .rail{display:flex; gap:4px; align-items:stretch; height:8px}
  .tie{flex:1; border-radius:2px; background:var(--line); transition:background .25s ease}
  .tie.done{background:var(--go)}
  .tie.current{background:var(--accent)}
  .rail-caption{display:flex; justify-content:space-between; margin-top:7px}
  .rail-caption span{font-family:var(--font-mono); font-size:11px; color:var(--ink-muted)}

  /* ---- Layout ---- */
  main{max-width:640px; margin:0 auto; padding-bottom:120px}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:22px 20px; margin-top:18px;
  }
  .card + .card{margin-top:14px}
  .section-title{font-size:23px; margin-top:6px}
  .section-intro{color:var(--ink-muted); font-size:14.5px; line-height:1.55; margin-top:8px}
  .note{
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; font-size:13.5px; color:var(--ink-muted); line-height:1.5; margin-top:14px;
  }

  /* ---- Fields ---- */
  label.field-label{display:block; font-family:var(--font-head); font-weight:600; font-size:14.5px; margin-bottom:6px}
  input[type=text], input[type=date], input[type=tel], select, textarea{
    width:100%; font-family:var(--font-body); font-size:16px; color:var(--ink);
    background:var(--panel-2); border:1px solid var(--line-strong); border-radius:10px;
    padding:12px 13px; margin-bottom:16px;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  textarea{min-height:70px; resize:vertical}

  /* ---- PIN entry ---- */
  input.pin-input{
    font-family:var(--font-mono); font-size:32px; letter-spacing:.4em; text-align:center;
    padding:16px 13px;
  }

  /* ---- Yes/No question rows ---- */
  .qrow{padding:16px 0; border-top:1px solid var(--line)}
  .qrow:first-of-type{border-top:none; padding-top:6px}
  .qrow .qtext{font-size:15.5px; line-height:1.5; margin-bottom:10px}
  .yn{display:flex; gap:8px}
  .yn button{
    flex:1; padding:13px 0; font-family:var(--font-head); font-weight:700; font-size:15px;
    letter-spacing:.03em; border-radius:10px; border:1.5px solid var(--line-strong);
    background:var(--panel-2); color:var(--ink); cursor:pointer;
  }
  .yn button.yes.sel{background:var(--go-soft); border-color:var(--go); color:var(--go)}
  .yn button.no.sel{background:var(--stop-soft); border-color:var(--stop); color:var(--stop)}
  .choice-row{display:flex; gap:8px; margin-top:2px; flex-wrap:wrap}
  .choice-row button{
    flex:1 1 auto; padding:12px 8px; font-size:14.5px; border-radius:10px; border:1.5px solid var(--line-strong);
    background:var(--panel-2); color:var(--ink); cursor:pointer; font-family:var(--font-body); font-weight:600;
  }
  .choice-row button.sel{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}

  .progress-count{font-family:var(--font-mono); font-size:12px; color:var(--ink-muted); margin-top:2px}

  ul.acc-list{margin:12px 0 0; padding-left:20px; font-size:14.5px; line-height:1.6; color:var(--ink)}
  ul.acc-list li{margin-bottom:6px}

  /* ---- Signature ---- */
  .sig-wrap{border:1.5px dashed var(--line-strong); border-radius:12px; background:var(--panel-2); overflow:hidden}
  canvas#sigpad{width:100%; height:180px; touch-action:none; display:block}
  .sig-actions{display:flex; justify-content:space-between; align-items:center; margin-top:8px}
  .sig-actions button{
    font-family:var(--font-head); font-weight:600; font-size:13px; letter-spacing:.03em;
    background:none; border:none; color:var(--ink-muted); cursor:pointer; padding:6px 0;
  }

  /* ---- Bottom nav ---- */
  .navbar{
    position:fixed; left:0; right:0; bottom:0; background:var(--paper);
    border-top:1px solid var(--line); padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
  }
  .navbar-inner{max-width:640px; margin:0 auto; display:flex; gap:10px}
  .btn{
    flex:1; font-family:var(--font-head); font-weight:700; font-size:16px; letter-spacing:.02em;
    padding:15px 0; border-radius:11px; border:1.5px solid var(--line-strong); cursor:pointer;
    background:var(--panel); color:var(--ink);
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.primary:disabled{opacity:.45; cursor:not-allowed}
  .btn.ghost{flex:0 0 84px}

  .flag{
    display:inline-flex; align-items:center; gap:6px; font-family:var(--font-head); font-weight:600;
    font-size:12.5px; letter-spacing:.03em; padding:4px 10px; border-radius:99px; margin-top:10px;
  }
  .flag.warn{background:var(--stop-soft); color:var(--stop)}

  /* ---- Start / done screens ---- */
  .hero-mark{
    width:44px; height:44px; border-radius:10px; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-head); font-weight:700; font-size:20px;
    margin-bottom:14px;
  }
  .done-ref{font-family:var(--font-mono); font-size:14px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:8px; padding:10px 12px; margin-top:14px; word-break:break-all}

  @media (max-width:420px){
    .section-title{font-size:20px}
    canvas#sigpad{height:160px}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">Sedulous Rail</div>
  <div class="doc-ref">PERSONAL DETAILS</div>
</div>
<div class="rail-wrap">
  <div class="rail" id="rail"></div>
  <div class="rail-caption"><span id="railLabel">SECTION 1 OF 10</span><span id="railName"></span></div>
</div>
<main id="app"></main>
<div class="navbar">
  <div class="navbar-inner" id="navbar"></div>
</div>

<script>
(function(){
"use strict";

var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybOaPmNQCHR_dsLOQTgFjhP2UdRlVRU6wJeAfUj207kTmzjMU4ggr9pOfOLqrky5RABQ/exec";
var DRAFT_KEY = "sedulous_personaldetails_draft_v1";

/* ---------------- section list ---------------- */

var SECTIONS = [
  { id:"pin", name:"Access code", type:"pin" },
  { id:"personal", name:"Your details", type:"personal" },
  { id:"work", name:"Work details", type:"work" },
  { id:"tax", name:"NI & UTR", type:"tax" },
  { id:"bank", name:"Bank details", type:"bank" },
  { id:"nok", name:"Next of kin", type:"nok" },
  { id:"declaration", name:"Declaration", type:"declaration" },
  { id:"signature", name:"Sign & submit", type:"signature" },
  { id:"done", name:"Submitted", type:"done" }
];

/* ---------------- state ---------------- */

var state = {
  step: 0,
  pin:"", pinError:"",
  name:"", address:"", dob:"",
  mobile:"", email:"", trade:"", sentinelNo:"",
  niNumber:"", utr:"", noUtr:false,
  bankAccountName:"", sortCode:"", accountNumber:"", rollNumber:"",
  nokName:"", nokRelationship:"", nokPhone:"",
  agree:null, date: todayISO(),
  signatureName:"", signatureData:null,
  submitted:false, submissionId:null
};
loadDraft();

function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }

function loadDraft(){
  try{
    var raw = localStorage.getItem(DRAFT_KEY);
    if(raw){
      var saved = JSON.parse(raw);
      if(saved && !saved.submitted){ Object.assign(state, saved); }
    }
  }catch(e){}
}
function saveDraft(){
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); }catch(e){}
}
function clearDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
}

/* ---------------- render ---------------- */

var app = document.getElementById("app");
var navbar = document.getElementById("navbar");

function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for(var k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k==="html") e.innerHTML = attrs[k];
    else if(k.indexOf("on")===0) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){ if(c) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}

function render(){
  renderRail();
  var section = SECTIONS[state.step];
  app.innerHTML = "";
  var card = el("div",{class:"card"});
  app.appendChild(card);

  RENDERERS[section.type](card, section);
  renderNav(section);
  saveDraft();
}

function renderRail(){
  var rail = document.getElementById("rail");
  rail.innerHTML = "";
  SECTIONS.forEach(function(s, i){
    if(s.type==="done") return;
    var cls = "tie" + (i < state.step ? " done" : i===state.step ? " current" : "");
    rail.appendChild(el("div",{class:cls}));
  });
  var total = SECTIONS.length - 1;
  document.getElementById("railLabel").textContent = state.step < total
    ? "SECTION " + (state.step+1) + " OF " + total
    : "COMPLETE";
  document.getElementById("railName").textContent = (SECTIONS[state.step].name||"").toUpperCase();
}

function renderNav(section){
  navbar.innerHTML = "";
  if(section.type==="done"){ return; }
  var isFirst = state.step===0;
  var isLastBeforeDone = SECTIONS[state.step+1] && SECTIONS[state.step+1].type==="done";

  if(!isFirst){
    navbar.appendChild(el("button",{class:"btn ghost", onclick:function(){ state.step--; render(); window.scrollTo(0,0); }},["Back"]));
  }
  var nextLabel = isLastBeforeDone ? "Review & sign" : "Next";
  var canGo = validateSection(section);
  var nextBtn = el("button",{class:"btn primary" + (canGo?"":""), onclick:function(){
    if(!validateSection(section)) return;
    if(section.type==="signature"){ submit(); return; }
    if(section.type==="pin"){ verifyPin(); return; }
    state.step++; render(); window.scrollTo(0,0);
  }},[nextLabel]);
  if(!canGo) nextBtn.disabled = true;
  navbar.appendChild(nextBtn);
}

/* ---------------- validation ---------------- */

function validateSection(section){
  switch(section.type){
    case "pin": return /^[0-9]{4}$/.test(state.pin);
    case "personal": return state.name.trim().length>1 && state.address.trim().length>3 && !!state.dob &&
      state.mobile.replace(/[^0-9]/g,"").length>=10 && /^\S+@\S+\.\S+$/.test(state.email.trim());
    case "work": return state.trade.trim().length>1;
    case "tax": return /^[A-Za-z]{2}[0-9]{6}[A-Za-z]$/.test(state.niNumber.replace(/\s/g,"")) &&
      (state.noUtr || state.utr.replace(/\D/g,"").length===10);
    case "bank": return state.bankAccountName.trim().length>1 &&
      state.sortCode.replace(/\D/g,"").length===6 && state.accountNumber.replace(/\D/g,"").length===8;
    case "nok": return state.nokName.trim().length>1 && state.nokRelationship.trim().length>1 && state.nokPhone.trim().length>1;
    case "declaration": return state.agree==="yes";
    case "signature": return state.signatureName.trim().length>1 && !!state.signatureData;
    default: return true;
  }
}

/* ---------------- section renderers ---------------- */

var RENDERERS = {};

function field(card, labelText, key, opts){
  opts = opts || {};
  card.appendChild(el("label",{class:"field-label"},[labelText]));
  card.appendChild(el("input",{
    type: opts.type || "text",
    inputmode: opts.inputmode || "",
    value: state[key],
    placeholder: opts.placeholder || "",
    class: opts.cls || "",
    oninput:function(e){ state[key] = e.target.value; renderNavOnly(); }
  }));
}

RENDERERS.pin = function(card){
  card.appendChild(el("div",{class:"hero-mark"},["SR"]));
  card.appendChild(el("h1",{class:"section-title"},["Personal & Bank Details"]));
  card.appendChild(el("p",{class:"section-intro"},[
    "This form collects your address, National Insurance number, UTR, bank details and next of kin, for Sedulous Rail's records. It's not shared with anyone outside the company, including auditors. Takes about 5 minutes."
  ]));
  card.appendChild(el("label",{class:"field-label"},["Enter the 4-digit access code you were given"]));
  card.appendChild(el("input",{type:"text", inputmode:"numeric", maxlength:"4", class:"pin-input",
    value:state.pin, placeholder:"••••",
    oninput:function(e){
      state.pin = e.target.value.replace(/[^0-9]/g,"").slice(0,4); e.target.value = state.pin; state.pinError = "";
      var old = document.getElementById("pinerr"); if(old) old.remove();
      renderNavOnly();
    }}));
  if(state.pinError){
    card.appendChild(el("div",{class:"flag warn", id:"pinerr", style:"margin-top:0; margin-bottom:12px"},[state.pinError]));
  }
  card.appendChild(el("div",{class:"note"},["Don't have a code? Ask whoever sent you this link — it's given separately from the link itself, not written down anywhere on this page."]));
};

function renderNavOnly(){
  var section = SECTIONS[state.step];
  renderNav(section);
  saveDraft();
}

RENDERERS.personal = function(card){
  card.appendChild(el("h2",{class:"section-title"},["Your details"]));
  field(card, "Full name", "name", {placeholder:"e.g. Jordan Miles"});
  field(card, "Home address", "address", {placeholder:"Full address including postcode"});
  card.appendChild(el("label",{class:"field-label"},["Date of birth"]));
  card.appendChild(el("input",{type:"date", value:state.dob, oninput:function(e){ state.dob=e.target.value; renderNavOnly(); }}));
  field(card, "Your mobile number", "mobile", {placeholder:"e.g. 07700 900123", type:"tel"});
  field(card, "Your email address", "email", {placeholder:"e.g. name@example.com", inputmode:"email"});
};

RENDERERS.work = function(card){
  card.appendChild(el("h2",{class:"section-title"},["Work details"]));
  field(card, "Trade / role", "trade", {placeholder:"e.g. PTS Operative, Ganger"});
  field(card, "Sentinel number (leave blank if you don't know it)", "sentinelNo", {placeholder:"e.g. 1437171", inputmode:"numeric"});
};

RENDERERS.tax = function(card){
  card.appendChild(el("h2",{class:"section-title"},["NI & UTR"]));
  card.appendChild(el("p",{class:"section-intro"},["Your National Insurance number and Unique Taxpayer Reference, exactly as they appear on your NI card/letter and HMRC UTR letter."]));
  field(card, "National Insurance number", "niNumber", {placeholder:"e.g. QQ123456C (2 letters, 6 numbers, 1 letter)"});
  if(!state.noUtr){
    field(card, "UTR (Unique Taxpayer Reference)", "utr", {placeholder:"10 digits", inputmode:"numeric"});
  }
  var utrRow = el("div",{class:"choice-row"});
  utrRow.appendChild(el("button",{class:(state.noUtr?"sel":""), onclick:function(){
    state.noUtr = !state.noUtr; if(state.noUtr) state.utr = ""; render();
  }},[state.noUtr ? "I don't have a UTR yet (tap to undo)" : "I don't have a UTR yet"]));
  card.appendChild(utrRow);
  if(state.noUtr){
    card.appendChild(el("div",{class:"note"},["No problem \u2014 you can still submit. We'll be in touch about getting your UTR sorted."]));
  }
};

RENDERERS.bank = function(card){
  card.appendChild(el("h2",{class:"section-title"},["Bank details"]));
  card.appendChild(el("p",{class:"section-intro"},["Where your pay should be sent. Sort code is 6 digits and account number is 8 digits (keep any leading zero). Double-check them carefully — a wrong digit can misdirect a payment."]));
  field(card, "Account name (as it appears on your bank account)", "bankAccountName", {placeholder:"e.g. J Miles"});
  field(card, "Sort code", "sortCode", {placeholder:"e.g. 12-34-56", inputmode:"numeric"});
  field(card, "Account number", "accountNumber", {placeholder:"e.g. 12345678", inputmode:"numeric"});
  field(card, "Building Society Roll Number (only if you have one)", "rollNumber", {placeholder:"Leave blank if not applicable"});
};

RENDERERS.nok = function(card){
  card.appendChild(el("h2",{class:"section-title"},["Next of kin"]));
  card.appendChild(el("p",{class:"section-intro"},["Who we should contact in an emergency."]));
  field(card, "Full name", "nokName", {placeholder:"e.g. Michelle Miles"});
  field(card, "Relationship to you", "nokRelationship", {placeholder:"e.g. Partner, Parent, Sibling"});
  field(card, "Phone number", "nokPhone", {placeholder:"e.g. 07700 900123", type:"tel"});
};

RENDERERS.declaration = function(card){
  card.appendChild(el("h2",{class:"section-title"},["Declaration"]));
  card.appendChild(el("p",{class:"section-intro"},[
    "I confirm the personal, tax, bank and next of kin details provided are accurate to the best of my knowledge, and consent to Sedulous Rail Ltd holding this information for employment, payroll and Sentinel Scheme administration purposes."
  ]));
  var row = el("div",{class:"qrow"});
  row.appendChild(el("div",{class:"qtext"},["Do you confirm the above?"]));
  var yn = el("div",{class:"yn"});
  yn.appendChild(el("button",{class:"yes"+(state.agree==="yes"?" sel":""), onclick:function(){ state.agree="yes"; render(); }},["Yes"]));
  yn.appendChild(el("button",{class:"no"+(state.agree==="no"?" sel":""), onclick:function(){ state.agree="no"; render(); }},["No"]));
  row.appendChild(yn);
  card.appendChild(row);
  if(state.agree==="no"){
    card.appendChild(el("div",{class:"note"},["You need to confirm this to submit. If you have questions, speak to your manager first."]));
  }
};

var sigCtx=null, sigDrawing=false, sigHasStroke=false;

RENDERERS.signature = function(card){
  card.appendChild(el("h2",{class:"section-title"},["Sign & submit"]));
  card.appendChild(el("p",{class:"section-intro"},[
    "By signing below I confirm that the information provided in this form is true and accurate to the best of my knowledge."
  ]));

  card.appendChild(el("label",{class:"field-label"},["Type your full name (this is your legal signature)"]));
  card.appendChild(el("input",{type:"text", value:state.signatureName, placeholder:"Full name",
    oninput:function(e){ state.signatureName = e.target.value; renderNavOnly(); }}));

  card.appendChild(el("label",{class:"field-label"},["Sign with your finger below"]));
  var wrap = el("div",{class:"sig-wrap"});
  var canvas = el("canvas",{id:"sigpad"});
  wrap.appendChild(canvas);
  card.appendChild(wrap);
  var actions = el("div",{class:"sig-actions"});
  actions.appendChild(el("span",{style:"font-family:var(--font-mono);font-size:11px;color:var(--ink-muted)"},["Date: " + state.date]));
  actions.appendChild(el("button",{onclick:function(){ clearSig(); }},["Clear"]));
  card.appendChild(actions);

  setTimeout(function(){ setupSignaturePad(canvas); }, 0);
};

function setupSignaturePad(canvas){
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  sigCtx = canvas.getContext("2d");
  sigCtx.scale(dpr, dpr);
  sigCtx.lineWidth = 2.2;
  sigCtx.lineCap = "round";
  sigCtx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#1a2420";
  sigHasStroke = false;

  if(state.signatureData){
    var img = new Image();
    img.onload = function(){ sigCtx.drawImage(img,0,0,rect.width,rect.height); };
    img.src = state.signatureData;
    sigHasStroke = true;
  }

  var last = null;
  function pos(e){
    var r = canvas.getBoundingClientRect();
    var p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  }
  function start(e){ e.preventDefault(); sigDrawing = true; last = pos(e); }
  function move(e){
    if(!sigDrawing) return;
    e.preventDefault();
    var p = pos(e);
    sigCtx.beginPath(); sigCtx.moveTo(last.x,last.y); sigCtx.lineTo(p.x,p.y); sigCtx.stroke();
    last = p; sigHasStroke = true;
  }
  function end(){
    if(!sigDrawing) return;
    sigDrawing = false;
    state.signatureData = canvas.toDataURL("image/png");
    saveDraft();
    renderNavOnly();
  }
  canvas.addEventListener("pointerdown", start);
  canvas.addEventListener("pointermove", move);
  window.addEventListener("pointerup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}

function clearSig(){
  var canvas = document.getElementById("sigpad");
  if(sigCtx && canvas){
    var rect = canvas.getBoundingClientRect();
    sigCtx.clearRect(0,0,rect.width,rect.height);
  }
  state.signatureData = null;
  sigHasStroke = false;
  renderNavOnly();
}

RENDERERS.done = function(card){
  card.appendChild(el("div",{class:"hero-mark", style:"background:var(--go)"},["✓"]));
  card.appendChild(el("h2",{class:"section-title"},["Submitted"]));
  card.appendChild(el("p",{class:"section-intro"},[
    "Thanks, " + (state.name||"") + " — your details have been sent to Sedulous Rail and will be filed against your name. You don't need to do anything else."
  ]));
  card.appendChild(el("div",{class:"note"},["Keep this reference for your records:"]));
  card.appendChild(el("div",{class:"done-ref"},[state.submissionId || ""]));
};

/* ---------------- submit ---------------- */

function buildPayload(){
  return {
    pin: state.pin,
    name: state.name, address: state.address, dob: state.dob,
    mobile: state.mobile, email: state.email, trade: state.trade, sentinelNo: state.sentinelNo,
    niNumber: state.niNumber.replace(/\s/g,"").toUpperCase(), utr: state.utr.replace(/\D/g,""), noUtr: state.noUtr,
    bankAccountName: state.bankAccountName, sortCode: state.sortCode.replace(/\D/g,"").replace(/^(\d{2})(\d{2})(\d{2})$/,"$1-$2-$3"),
    accountNumber: state.accountNumber.replace(/\D/g,""), rollNumber: state.rollNumber,
    nokName: state.nokName, nokRelationship: state.nokRelationship, nokPhone: state.nokPhone,
    declarationAgreed: state.agree,
    signatureName: state.signatureName, signatureDate: state.date, signaturePng: state.signatureData,
    submittedAt: new Date().toISOString()
  };
}

function checkPin(pin, done){
  var cbName = "srPin" + Date.now();
  var finished = false;
  var s = document.createElement("script");
  function finish(result){
    if(finished) return;
    finished = true;
    try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; }
    if(s.parentNode) s.parentNode.removeChild(s);
    done(result);
  }
  window[cbName] = function(r){ finish(r); };
  s.onerror = function(){ finish(null); };
  s.src = SCRIPT_URL + "?action=checkpin&pin=" + encodeURIComponent(pin) + "&callback=" + cbName;
  document.head.appendChild(s);
  setTimeout(function(){ finish(null); }, 15000);
}

function verifyPin(){
  var btn = navbar.querySelector(".btn.primary");
  if(btn){ btn.disabled = true; btn.textContent = "Checking\u2026"; }
  checkPin(state.pin, function(r){
    if(r && r.ok){
      state.pinError = "";
      state.step++; render(); window.scrollTo(0,0);
    } else {
      state.pinError = !r ? "Couldn't check the code \u2014 check your signal and try again."
        : (r.locked ? "Too many wrong attempts. Please try again later or contact the office."
                    : "That code isn't right. Check it and try again.");
      render();
    }
  });
}

function submit(){
  var section = SECTIONS[state.step];
  if(!validateSection(section)) return;

  var nextBtn = navbar.querySelector(".btn.primary");
  if(nextBtn){ nextBtn.disabled = true; nextBtn.textContent = "Submitting…"; }

  var payload = buildPayload();
  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function(){
    finishSubmit();
  }).catch(function(){
    finishSubmit();
  });
}

function finishSubmit(){
  state.submitted = true;
  state.submissionId = "SR-PD-" + Date.now().toString(36).toUpperCase();
  clearDraft();
  state.step = SECTIONS.length - 1;
  render();
}

render();
})();
</script>
